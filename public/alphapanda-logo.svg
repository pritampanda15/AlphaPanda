<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ap-shell" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13223D" />
      <stop offset="50%" stop-color="#091121" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="ap-rim" x1="64" y1="4" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#64D2FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.06" />
    </linearGradient>
    <radialGradient id="ap-aura" cx="64" cy="30" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ap-pearl" x1="64" y1="30" x2="64" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F0FC" />
    </linearGradient>
    <linearGradient id="ap-ribbon" x1="18" y1="24" x2="110" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
  </defs>

  <!-- Apple Liquid Glass Squircle Tile -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#ap-shell)" />
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#ap-aura)" />
  <rect x="7" y="7" width="114" height="114" rx="29" stroke="url(#ap-rim)" stroke-width="2" />

  <!-- Back Orbital Protein Fold Arc -->
  <path
    d="M19 82 C 16 48, 42 22, 74 22 C 95 22, 108 35, 110 52"
    stroke="url(#ap-ribbon)"
    stroke-width="3.6"
    stroke-opacity="0.48"
    stroke-linecap="round"
  />

  <!-- Sculptural Panda Ears -->
  <circle cx="38" cy="40" r="12" fill="#0B1325" stroke="url(#ap-ribbon)" stroke-width="2.6" />
  <circle cx="90" cy="40" r="12" fill="#0B1325" stroke="url(#ap-ribbon)" stroke-width="2.6" />

  <!-- Clean Symmetrical Geometric Panda Head -->
  <path
    d="M64 35 C 85.5 35, 97.5 49.5, 97.5 67.5 C 97.5 86, 83.5 97, 64 97 C 44.5 97, 30.5 86, 30.5 67.5 C 30.5 49.5, 42.5 35, 64 35 Z"
    fill="url(#ap-pearl)"
  />

  <!-- Precision Tilted Eye Patches -->
  <ellipse cx="49" cy="64.5" rx="9" ry="11.2" transform="rotate(-15 49 64.5)" fill="#091121" />
  <ellipse cx="79" cy="64.5" rx="9" ry="11.2" transform="rotate(15 79 64.5)" fill="#091121" />

  <!-- Luminous Sapphire Eye Glints -->
  <circle cx="51" cy="62.2" r="3.1" fill="url(#ap-ribbon)" />
  <circle cx="77" cy="62.2" r="3.1" fill="url(#ap-ribbon)" />
  <circle cx="52.1" cy="61.1" r="1.15" fill="#FFFFFF" />
  <circle cx="78.1" cy="61.1" r="1.15" fill="#FFFFFF" />

  <!-- Refined Geometric Nose & Confident Symmetrical Smile -->
  <path
    d="M59.5 74.6 C 59.5 73.1, 68.5 73.1, 68.5 74.6 C 68.5 76.8, 65.8 79.3, 64 79.3 C 62.2 79.3, 59.5 76.8, 59.5 74.6 Z"
    fill="#091121"
  />
  <path
    d="M55.5 83.5 C 58.5 87.2, 69.5 87.2, 72.5 83.5"
    stroke="#091121"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- Foreground Sweeping Alpha-Ribbon Orbit (Structural Folding Signature) -->
  <path
    d="M22 92 C 38 109, 86 112, 108 86"
    stroke="url(#ap-ribbon)"
    stroke-width="4.4"
    stroke-linecap="round"
  />
  <circle cx="22" cy="92" r="3.4" fill="#7DD3FC" />
  <circle cx="108" cy="86" r="3.4" fill="#0A84FF" />
  <circle cx="108" cy="86" r="1.3" fill="#FFFFFF" />
</svg>
